    <details class="settings"><summary title="設定 Settings" aria-label="設定 Settings"><span aria-hidden="true">⚙</span></summary>

        <label class="set-row">縦書きの文章 <span class="en-inline">Vertical texts</span>
          <select id="vmode-set"><option value="auto">自動 Auto</option><option value="v">縦 Vertical</option><option value="h">横 Horizontal</option></select></label>
        <button class="btn small" onclick="N2.resetProgress()">進度をリセット <span class="en-inline">Reset progress</span></button>
